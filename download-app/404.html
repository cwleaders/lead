<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Page not found — CW Leaders</title>
  <meta name="description" content="The page you were looking for doesn't exist on CW Leaders. Try the dashboard, or send us a note." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://lead.cwleaders.com/404" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/eq.css" />
  <link rel="stylesheet" href="/lead.css" />
  <link rel="stylesheet" href="/nav.css" />
  <style>
    body { overflow: hidden; }
    .nf-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 80px 20px;
      position: relative;
      z-index: 1;
    }
    .nf-card {
      max-width: 520px;
      text-align: center;
      padding: 40px 32px;
      border-radius: 22px;
      background: rgba(22, 30, 54, 0.65);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }
    .nf-num {
      font-size: clamp(64px, 12vw, 120px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--c-warning) 0%, var(--c-creative) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .nf-title {
      font-size: 22px;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      color: var(--t1);
    }
    .nf-sub {
      color: var(--t2);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .nf-cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nf-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: transform 140ms var(--ease-snap), background 140ms var(--ease-snap);
    }
    .nf-cta-primary {
      background: var(--c-warning);
      color: var(--void);
    }
    .nf-cta-primary:hover { transform: translateY(-2px); }
    .nf-cta-ghost {
      background: rgba(255,255,255,0.05);
      color: var(--t1);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .nf-cta-ghost:hover { background: rgba(255,255,255,0.08); }
    .nf-help {
      margin-top: 24px;
      color: var(--t3);
      font-size: 12px;
    }
    .nf-help a { color: var(--c-warning); text-decoration: none; }
  </style>
</head>
<body>
  <div class="dotgrid" aria-hidden="true"></div>
  <header id="cw-nav"></header>

  <main>
    <section class="nf-shell">
      <article class="nf-card" role="main">
        <div class="nf-num">404</div>
        <h1 class="nf-title">This page doesn't exist.</h1>
        <p class="nf-sub">The link may be old, misspelled, or moved. The good news: we kept the four tools and the dashboard exactly where you left them.</p>
        <div class="nf-cta-row">
          <a class="nf-cta nf-cta-primary" href="https://upload.cwleaders.com">Get a download link →</a>
          <a class="nf-cta nf-cta-ghost" href="/">CW Leaders home</a>
        </div>
        <p class="nf-help">Still lost? Email <a href="mailto:hello@cwleaders.com">hello@cwleaders.com</a>.</p>
      </article>
    </section>
  </main>

  <script src="/lead.js"></script>
  <script src="/nav.js" defer></script>
</body>
</html>
