# cargo-deny config — supply-chain policy for CW Leaders Studio Rust deps
# Run: cargo deny check
# Ref: https://embarkstudios.github.io/cargo-deny/

[graph]
# Don't traverse dev-dependencies for advisories
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "Unlicense",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.93
exceptions = []

# Block GPL/AGPL/LGPL/CC-NC family — incompatible with proprietary distribution
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # Known unsafe/abandoned crates (examples — extend as needed)
  { name = "openssl", reason = "Use rustls instead — already enforced via reqwest features" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
