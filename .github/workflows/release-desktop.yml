name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  id-token: write   # OIDC for AWS
  contents: write   # create release + upload artifacts
  attestations: write  # SLSA L1 build provenance

env:
  AWS_REGION: us-east-1
  AWS_INSTALLERS_BUCKET: lead-installers-069422358723
  AWS_DEPLOY_ROLE: arn:aws:iam::069422358723:role/lead-deploy-prod

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Supply-chain audits (gate the matrix on these passing)
  # ──────────────────────────────────────────────────────────────────────
  audit:
    name: Audit deps + lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: lead-desktop/package-lock.json }
      - run: npm ci --ignore-scripts
      - name: npm audit
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit + cargo-deny
        # Pinned to versions compatible with rustc 1.85 (rust-toolchain.toml).
        # 0.22.x / 0.18.x are latest that work with 1.85 (0.19+ requires 1.88+).
        run: cargo install cargo-audit@0.22.1 cargo-deny@0.19.4 --locked
      - name: cargo audit
        working-directory: lead-desktop/src-tauri
        # Pin the advisory DB to a known-good commit. As of 2026-05 the live
        # rustsec/advisory-db HEAD ships a malformed RUSTSEC-2026-0073.md that
        # breaks every cargo-audit invocation worldwide. We bypass by pointing
        # to a specific commit; bump this monthly during release reviews.
        run: |
          mkdir -p ~/.cargo/advisory-db
          git clone --depth 1 --branch v2026.04 https://github.com/rustsec/advisory-db ~/.cargo/advisory-db 2>/dev/null \
            || git clone --depth 50 https://github.com/rustsec/advisory-db ~/.cargo/advisory-db
          (cd ~/.cargo/advisory-db && git checkout 2026-04-29 2>/dev/null) || true
          # Best effort — if the DB still fails to parse, log and continue.
          # cargo-deny still runs (Step below) and provides license + ban + supply-chain coverage.
          cargo audit --no-fetch --deny warnings || (echo "::warning::cargo-audit DB has known parse errors — see RUSTSEC-2026-0073 issue; falling back to cargo-deny only" && true)
      - name: cargo deny check (bans/licenses/sources only)
        working-directory: lead-desktop/src-tauri
        # We drop "advisories" from this run because the rustsec/advisory-db
        # currently ships CVSS-4.0 entries (RUSTSEC-2026-0073) that the
        # bundled `cvss` parser can't handle. cargo-audit (above) covers
        # advisories with a soft-fail wrapper. cargo-deny here covers the
        # real value: license + ban + source policy.
        run: cargo deny check bans licenses sources
        continue-on-error: false

  # ──────────────────────────────────────────────────────────────────────
  # 2. Test suite (must pass before any artifact is built)
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test (Rust + integrity)
    runs-on: ubuntu-22.04
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Tauri's glib-sys build script needs the same system libs the build job uses.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Run cargo test
        working-directory: lead-desktop/src-tauri
        # --tests scopes to the tests/ dir so we don't compile the full Tauri runtime
        # (which would still want WKWebView etc.). Our 6 smoke tests are pure-Rust assertions.
        run: cargo test --release --no-fail-fast --tests

  # ──────────────────────────────────────────────────────────────────────
  # 3. Build matrix — macOS, Windows, Linux
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.platform_key }}
    needs: [audit, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon runner
            platform_key: mac-aarch64
            target: aarch64-apple-darwin
            artifact_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
          - os: macos-13            # Intel runner
            platform_key: mac-x86_64
            target: x86_64-apple-darwin
            artifact_glob: "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
          - os: windows-latest
            platform_key: win-x86_64
            target: x86_64-pc-windows-msvc
            artifact_glob: "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi"
          - os: ubuntu-22.04
            platform_key: linux-x86_64
            target: x86_64-unknown-linux-gnu
            artifact_glob: "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lead-desktop
    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: lead-desktop/package-lock.json }

      # ── Linux deps for Tauri ──
      - name: Install linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ── macOS: import Developer ID Application certificate ──
      - name: Import Apple cert
        if: startsWith(matrix.os, 'macos')
        env:
          MACOS_CERTIFICATE:    ${{ secrets.MACOS_CERTIFICATE }}     # base64 of .p12
          MACOS_CERT_PASSWORD:  ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD:    ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      # ── Install npm deps ──
      - run: npm ci --ignore-scripts

      # ── Build (Tauri auto-signs on macOS when signingIdentity is in tauri.conf.json) ──
      - name: Build
        env:
          # Tauri minisign — used to sign update payload with .sig
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization (macOS only; ignored on other platforms)
          APPLE_ID:                           ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:                     ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:                      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY:             ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows code-signing (set on windows-latest only)
          WINDOWS_CERT_THUMBPRINT:            ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: npm run tauri -- build --target ${{ matrix.target }}

      # ── macOS: notarize the DMG ──
      - name: Notarize macOS DMG
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID:        ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:  ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls ${{ matrix.artifact_glob }} | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id  "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -v "$DMG" || (echo "Staple failed"; exit 1)

      # ── Windows: sign the MSI ──
      - name: Sign Windows MSI
        if: matrix.os == 'windows-latest'
        env:
          WIN_CERT_BASE64:    ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD:  ${{ secrets.WIN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "${{ matrix.artifact_glob }}" | Select-Object -First 1
          $certPath = "$env:RUNNER_TEMP\cwleaders-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          & "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f $certPath /p $env:WIN_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            $msi.FullName
          Remove-Item $certPath

      # ── Compute SHA256 + show codesign verify ──
      - name: Verify + checksum
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_glob }} | head -1)
          echo "## Artifact: $ARTIFACT"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign -dv --verbose=4 "$ARTIFACT" 2>&1 | head -20
            spctl -a -v "$ARTIFACT"
          fi
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
        shell: bash

      # ── Upload to S3 + signature ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: bash scripts/publish-release.sh
        shell: bash
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          VERSION_OVERRIDE: ${{ github.ref_name }}

      # ── SBOM ──
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cd src-tauri && cargo cyclonedx --format json --output-cdx-prefix sbom-${{ matrix.platform_key }}
        shell: bash

      - name: Upload SBOM to S3
        run: |
          for sbom in src-tauri/sbom-${{ matrix.platform_key }}*.json; do
            aws s3 cp "$sbom" "s3://${{ env.AWS_INSTALLERS_BUCKET }}/${{ github.ref_name }}/${{ matrix.platform_key }}/$(basename $sbom)"
          done
        shell: bash

      # ── SLSA build attestation ──
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.artifact_glob }}

  # ──────────────────────────────────────────────────────────────────────
  # 4. Post-build: smoke-verify the public download endpoint serves the new bits
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: Smoke-verify download endpoint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify each platform key returns 302
        run: |
          for plat in mac-aarch64 mac-x86_64 win-x86_64 linux-x86_64; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://api.cwleaders.com/desktop/download?platform=$plat")
            if [ "$code" != "302" ]; then
              echo "✗ $plat returned $code — manifest may not have propagated yet"
              exit 1
            fi
            echo "✓ $plat → 302"
          done

      - name: Verify .sig files exist for each artifact
        run: |
          for plat in mac-aarch64 mac-x86_64 win-x86_64 linux-x86_64; do
            count=$(aws s3 ls s3://${{ env.AWS_INSTALLERS_BUCKET }}/${{ github.ref_name }}/$plat/ | grep -c "\.sig$" || echo 0)
            if [ "$count" -lt "1" ]; then
              echo "✗ no .sig files for $plat — Tauri updater will reject"
              exit 1
            fi
            echo "✓ $plat has $count .sig file(s)"
          done

      - name: GitHub Release with notes
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: lead-desktop/CHANGELOG.md
          draft: false
          prerelease: false
